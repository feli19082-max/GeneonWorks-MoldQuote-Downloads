name: Verify MoldQuote R6.2 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-r6.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-r6-2:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: R6.2
      RELEASE_ASSET_NAME: GeneonWorks-MoldQuote-R6.2-win-x64.zip
      CHECKSUM_ASSET_NAME: GeneonWorks-MoldQuote-R6.2-win-x64.zip.sha256

    steps:
      - name: Checkout downloads repository
        uses: actions/checkout@v4

      - name: Verify release attachment list
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG) { throw 'R6.2 release tag is missing.' }
          if ($release.isDraft) { throw 'R6.2 release is still a draft.' }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains $env:RELEASE_ASSET_NAME) { throw "Release ZIP is missing: $env:RELEASE_ASSET_NAME" }
          if ($assetNames -notcontains $env:CHECKSUM_ASSET_NAME) { throw "Checksum is missing: $env:CHECKSUM_ASSET_NAME" }
          $release | ConvertTo-Json -Depth 8 | Set-Content out/release-metadata.json -Encoding utf8

      - name: Download published attachments
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:RELEASE_ASSET_NAME --dir out
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:CHECKSUM_ASSET_NAME --dir out

      - name: Verify SHA256 checksum
        shell: pwsh
        run: |
          $actualHash = (Get-FileHash "out/$env:RELEASE_ASSET_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = (Get-Content "out/$env:CHECKSUM_ASSET_NAME" -Raw).Trim()
          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "SHA256 mismatch. Expected $expectedHash but got $actualHash"
          }
          $actualHash | Set-Content out/verified-sha256.txt -Encoding ascii

      - name: Inspect published package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/package | Out-Null
          Expand-Archive "out/$env:RELEASE_ASSET_NAME" -DestinationPath out/package -Force

          $desktopExe = Get-ChildItem out/package -Recurse -File -Filter 'GeneonWorks.MoldQuote.Desktop.exe' | Select-Object -First 1
          if (-not $desktopExe) { throw 'Desktop executable is missing from the published package.' }

          $occtRuntime = Get-ChildItem out/package -Recurse -File | Where-Object {
            $_.Name -match '^(TK.*|TKernel|GeneonWorks\.MoldQuote\.Geometry\.Occt)\.dll$'
          }
          if (-not $occtRuntime) { throw 'OCCT native runtime is missing from the published package.' }

          $forbidden = Get-ChildItem out/package -Recurse -File | Where-Object {
            $_.FullName -match 'LicenseTool|private-key|Program\.cs|\\tools\\'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden release file: $($_.FullName)" }
            exit 1
          }

          $desktopVersion = (Get-Item $desktopExe.FullName).VersionInfo.FileVersion
          $packageBytes = (Get-Item "out/$env:RELEASE_ASSET_NAME").Length
          $occtCount = @($occtRuntime).Count
          $verifiedHash = (Get-Content out/verified-sha256.txt -Raw).Trim()
          New-Item -ItemType Directory -Force -Path release-status | Out-Null
          @"
          # R6.2 Publication Verification

          - Status: VERIFIED
          - Release tag: R6.2
          - Package: $env:RELEASE_ASSET_NAME
          - SHA256: $verifiedHash
          - Package bytes: $packageBytes
          - Desktop file version: $desktopVersion
          - OCCT runtime files detected: $occtCount
          - Private license tool/key included: No
          - Verified at UTC: $([DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          "@ | Set-Content release-status/R6.2-success.md -Encoding utf8

      - name: Commit publication verification record
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/R6.2-success.md
          git commit -m 'release: verify R6.2 published package'
          git push
