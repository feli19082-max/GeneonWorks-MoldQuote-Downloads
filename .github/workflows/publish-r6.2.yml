name: Publish Latest MoldQuote R6.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-r6.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-r6-2:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: R6.2
      RELEASE_ASSET_NAME: GeneonWorks-MoldQuote-R6.2-win-x64.zip
      MANAGED_ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-c12c-81fd-9a6c-fd1e772c0f8e/raw?se=2026-07-18T14:48:50Z&sp=r&sv=2026-02-06&sr=b&scid=d21c2a43-54db-4690-9361-360c9b13f32c&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-18T14:12:45Z&ske=2026-07-20T14:12:45Z&sks=b&skv=2026-02-06&sig=9oL1XXlKkMb533qMidwajHqFe7j44hlB6dh8DejOVwU%3D"
      BRIDGE_ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-c210-81f5-bf31-4587b61b9648/raw?se=2026-07-18T14:48:56Z&sp=r&sv=2026-02-06&sr=b&scid=8f864036-f71e-4e94-85f6-0e0fe1eeaa03&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-18T00:22:24Z&ske=2026-07-20T00:22:24Z&sks=b&skv=2026-02-06&sig=L1jsn88wWFb0iseI6VggMwliNFODeBaIfOa3L5siGPI%3D"

    steps:
      - name: Checkout downloads repository
        uses: actions/checkout@v4

      - name: Download current complete package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/base-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:RELEASE_ASSET_NAME --dir out/base-download
          New-Item -ItemType Directory -Force -Path out/package | Out-Null
          Expand-Archive "out/base-download/$env:RELEASE_ASSET_NAME" -DestinationPath out/package -Force

      - name: Download latest verified managed application
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:MANAGED_ARTIFACT_URL -OutFile out/managed-artifact.zip
          New-Item -ItemType Directory -Force -Path out/managed-artifact | Out-Null
          Expand-Archive out/managed-artifact.zip -DestinationPath out/managed-artifact -Force
          $innerZip = Get-ChildItem out/managed-artifact -Recurse -File -Filter '*.zip' | Select-Object -First 1
          if (-not $innerZip) { throw 'Latest managed package was not found in the workflow artifact.' }
          New-Item -ItemType Directory -Force -Path out/managed | Out-Null
          Expand-Archive $innerZip.FullName -DestinationPath out/managed -Force

      - name: Download latest verified geometry bridge
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:BRIDGE_ARTIFACT_URL -OutFile out/bridge-artifact.zip
          New-Item -ItemType Directory -Force -Path out/bridge | Out-Null
          Expand-Archive out/bridge-artifact.zip -DestinationPath out/bridge -Force
          if (-not (Get-ChildItem out/bridge -Recurse -File -Filter 'GeneonWorks.MoldQuote.Geometry.Bridge.dll')) {
            throw 'Latest geometry bridge DLL is missing.'
          }
          if (-not (Get-ChildItem out/bridge -Recurse -File -Filter 'ijwhost.dll')) {
            throw 'Latest ijwhost.dll is missing.'
          }

      - name: Overlay latest application and geometry bridge
        shell: pwsh
        run: |
          $desktopExe = Get-ChildItem out/package -Recurse -File -Filter 'GeneonWorks.MoldQuote.Desktop.exe' | Select-Object -First 1
          if (-not $desktopExe) { throw 'Desktop executable is missing from the base package.' }
          $appDirectory = $desktopExe.Directory.FullName
          Copy-Item 'out/managed/*' $appDirectory -Recurse -Force

          $geometryDirectory = Join-Path $appDirectory 'geometry'
          New-Item -ItemType Directory -Force -Path $geometryDirectory | Out-Null
          $bridgeDll = Get-ChildItem out/bridge -Recurse -File -Filter 'GeneonWorks.MoldQuote.Geometry.Bridge.dll' | Select-Object -First 1
          $ijwHost = Get-ChildItem out/bridge -Recurse -File -Filter 'ijwhost.dll' | Select-Object -First 1
          Copy-Item $bridgeDll.FullName $geometryDirectory -Force
          Copy-Item $ijwHost.FullName $geometryDirectory -Force
          Copy-Item $ijwHost.FullName $appDirectory -Force

          $required = @(
            (Join-Path $appDirectory 'GeneonWorks.MoldQuote.Desktop.exe'),
            (Join-Path $geometryDirectory 'GeneonWorks.MoldQuote.Geometry.Bridge.dll'),
            (Join-Path $geometryDirectory 'ijwhost.dll'),
            (Join-Path $geometryDirectory 'TKernel.dll'),
            (Join-Path $geometryDirectory 'TKBRep.dll'),
            (Join-Path $geometryDirectory 'TKDESTEP.dll')
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) { throw ('Complete package is missing: ' + ($missing -join '; ')) }

          $forbidden = Get-ChildItem out/package -Recurse -File | Where-Object {
            $_.FullName -match 'LicenseTool|private-key|Program\.cs|\\tools\\'
          }
          if ($forbidden) { throw 'Package contains private tooling, keys, or source files.' }

      - name: Package and calculate checksum
        shell: pwsh
        run: |
          Compress-Archive -Path 'out/package/*' -DestinationPath "out/$env:RELEASE_ASSET_NAME" -Force
          $hash = (Get-FileHash "out/$env:RELEASE_ASSET_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:RELEASE_ASSET_NAME" | Set-Content "out/$env:RELEASE_ASSET_NAME.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Replace published release attachments
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "out/$env:RELEASE_ASSET_NAME" "out/$env:RELEASE_ASSET_NAME.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title 'GeneonWorks MoldQuote R6.2｜2026-07-18 最新版' --notes-file release-notes/R6.2.md

      - name: Verify published attachments
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/published | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:RELEASE_ASSET_NAME --dir out/published
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "$env:RELEASE_ASSET_NAME.sha256" --dir out/published
          $actual = (Get-FileHash "out/published/$env:RELEASE_ASSET_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content "out/published/$env:RELEASE_ASSET_NAME.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Published SHA256 mismatch: expected $expected, got $actual" }
          Write-Host "VERIFIED PUBLISHED PACKAGE: $actual"
