name: Publish download package

on:
  push:
    branches: [main]
    paths:
      - release-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout download repository
        uses: actions/checkout@v4

      - name: Replace release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(jq -r '.release_tag' release-request.json)"
          asset="$(jq -r '.asset_name' release-request.json)"
          url="$(jq -r '.download_url' release-request.json)"
          test -n "$tag" && test "$tag" != "null"
          test -n "$asset" && test "$asset" != "null"
          test -n "$url" && test "$url" != "null"

          curl --fail --location --silent --show-error "$url" --output artifact.zip
          unzip -t artifact.zip
          unzip -p artifact.zip "$asset" > "$asset"
          test -s "$asset"
          unzip -t "$asset"
          sha256sum "$asset" | tee release-sha256.txt

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "$tag" --notes "Windows x64 complete package."
          fi
